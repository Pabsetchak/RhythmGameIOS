name: Build unsigned iOS IPA

# Produces an unsigned .ipa on a GitHub-hosted macOS runner, so no Mac is
# needed locally. Download it from the run's Artifacts section and install it
# with Sideloadly or AltStore, which re-sign it with your own Apple ID.
#
# The test job runs first on Linux (billed 1x) and gates the macOS job
# (billed 10x), so a broken commit costs a minute instead of fifteen.

on:
  workflow_dispatch:
    inputs:
      pygame_version:
        description: "pygame-ce version (only versions with a published template work)"
        required: false
        default: "2.5.6"
  push:
    tags:
      - "v*"

env:
  APP_DIR: RhythmGame_iOS
  ENTRY: main.py

jobs:
  # --------------------------------------------------------------------- #
  # Cheap gate: does the app actually still work?
  # --------------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pygame-ce
        run: python -m pip install --upgrade pip "pygame-ce==2.5.6"

      - name: Compile every module
        run: python -m compileall -q "$APP_DIR"

      - name: Run the test suites
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python "$APP_DIR/tests/test_data.py"
          python "$APP_DIR/tests/test_screens.py"

  # --------------------------------------------------------------------- #
  # The expensive part
  # --------------------------------------------------------------------- #
  build:
    needs: test
    runs-on: macos-14
    timeout-minutes: 45

    env:
      PYGAME_VERSION: ${{ github.event.inputs.pygame_version || '2.5.6' }}

    steps:
      - uses: actions/checkout@v7

      # The template embeds a Python 3.13 XCFramework, so the toolchain that
      # stages the sources should match it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Show toolchain
        run: |
          python --version
          xcodebuild -version
          echo "Xcode path: $(xcode-select -p)"

      - name: Install pygame-ios
        run: python -m pip install --upgrade pip pygame-ios

      - name: Check the requested pygame-ce version has a template
        run: |
          set -uo pipefail
          URL=https://raw.githubusercontent.com/seekerluke/pygame-ios-templates/main/patches/pygame-ce.json
          if ! curl -fsSL "$URL" -o /tmp/templates.json; then
            echo "::warning::Could not fetch the template list; continuing anyway."
            exit 0
          fi
          echo "Template list:"; cat /tmp/templates.json
          python - "$PYGAME_VERSION" <<'PY'
          import json, sys
          wanted = sys.argv[1]
          data = json.load(open("/tmp/templates.json"))
          versions = data.get("supportedVersions", data) if isinstance(data, dict) else data
          if isinstance(versions, dict):
              versions = list(versions)
          if wanted not in versions:
              print(f"::error::pygame-ce {wanted} has no published iOS template. "
                    f"Available: {', '.join(map(str, versions))}")
              sys.exit(1)
          print(f"OK: pygame-ce {wanted} has a template.")
          PY

      # pygame_ios copies the whole folder into the bundle, so strip anything
      # that shouldn't ship on the device.
      - name: Trim the app folder
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          rm -rf tests
          find . -name "__pycache__" -type d -prune -exec rm -rf {} +
          find . -name "*.pyc" -delete
          # Machine-specific, and regenerated with defaults on first launch.
          rm -f rhythms/SETTINGS.json
          # Hit sounds are synthesized on first run. A CI checkout is clean,
          # but a local Mac build in a working tree that has run the tests
          # would otherwise ship a stale bank.
          rm -rf assets/hits_v*
          echo "--- shipping ---"
          find . -type f | sort

      - name: Pin the build target to iOS
        # The packaged app must never try to work out its own platform.
        # Guessing wrong on a device means the desktop path runs, a blocking
        # loop starves the run loop iOS owns, and the screen goes black with
        # nothing to explain it. Baking the answer in removes that failure
        # mode entirely.
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          cat > build_config.py <<'PY'
          """Generated by CI. Do not edit - see the checked-in version."""

          TARGET = "ios"
          PY
          echo "--- build_config.py ---"
          cat build_config.py
          python -c "
          import build_config
          assert build_config.TARGET == 'ios', build_config.TARGET
          print('build target pinned to', build_config.TARGET)
          "

      - name: Generate the Xcode project
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          pygame_ios . "$ENTRY" "$PYGAME_VERSION"
          echo "--- tree after generation ---"
          ls -la

      - name: Confirm the app sources reached the bundle
        # The entry script is renamed to __main__.py and the package folders
        # are copied recursively. If either is missing the build would still
        # succeed and then crash on launch, which is far harder to diagnose.
        run: |
          set -euo pipefail
          STAGED=$(find "$APP_DIR" -type d -path "*app/pygame-ios" | head -n 1)
          if [ -z "$STAGED" ]; then
            echo "::error::Could not find the staged app directory."
            find "$APP_DIR" -maxdepth 5 -type d | head -50
            exit 1
          fi
          echo "Staged at: $STAGED"
          # The pinned target must have survived staging, or the app is back
          # to guessing its platform on device.
          if ! grep -q 'TARGET = "ios"' "$STAGED/build_config.py" 2>/dev/null; then
            echo "::error::build_config.py in the bundle does not pin TARGET to ios."
            cat "$STAGED/build_config.py" 2>/dev/null || echo "(file missing)"
            exit 1
          fi
          echo "build target pinned in the bundle: ok"
          for required in __main__.py app.py ui.py touch.py road.py screens/play.py screens/editor.py; do
            if [ ! -f "$STAGED/$required" ]; then
              echo "::error::Missing $required in the staged bundle."
              find "$STAGED" -type f -name "*.py" | sort
              exit 1
            fi
          done
          echo "All required sources are present."

      - name: Locate the Xcode project
        id: locate
        run: |
          set -euo pipefail
          PROJ=$(find "$APP_DIR" -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::No .xcodeproj was generated."
            find "$APP_DIR" -maxdepth 4 -type d | head -50
            exit 1
          fi
          SCHEME=$(xcodebuild -project "$PROJ" -list -json \
            | python -c "import json,sys;print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJ"
          echo "Scheme:  $SCHEME"

      - name: Configure Info.plist
        # Portrait-only (the whole UI is laid out for it) and file sharing on,
        # so the app's folder appears in Files for moving songs and charts in
        # and out without a desktop.
        run: |
          set -euo pipefail
          PLIST=$(find "$APP_DIR" -name "Info.plist" -not -path "*/build/*" | head -n 1)
          if [ -z "$PLIST" ]; then
            echo "::warning::No Info.plist found; skipping configuration."
            exit 0
          fi
          echo "Configuring $PLIST"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }

          pb "Delete :UIFileSharingEnabled"
          pb "Add :UIFileSharingEnabled bool true"
          pb "Delete :LSSupportsOpeningDocumentsInPlace"
          pb "Add :LSSupportsOpeningDocumentsInPlace bool true"
          pb "Delete :UIRequiresFullScreen"
          pb "Add :UIRequiresFullScreen bool true"
          pb "Delete :UIStatusBarHidden"
          pb "Add :UIStatusBarHidden bool true"
          pb "Delete :UIViewControllerBasedStatusBarAppearance"
          pb "Add :UIViewControllerBasedStatusBarAppearance bool false"

          pb "Delete :UISupportedInterfaceOrientations"
          pb "Add :UISupportedInterfaceOrientations array"
          pb "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationPortrait"
          pb "Delete :UISupportedInterfaceOrientations~ipad"
          pb "Add :UISupportedInterfaceOrientations~ipad array"
          pb "Add :UISupportedInterfaceOrientations~ipad: string UIInterfaceOrientationPortrait"

          echo "--- resulting plist ---"
          plutil -p "$PLIST" | head -40

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme "${{ steps.locate.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Strip build intermediates from the bundle
        # The template's pygame-ce build ships meson's intermediate output:
        # directories named *.dylib.p / *.a.p full of .c.o object files, plus
        # .a static archives. Nothing loads them at runtime, but every
        # signing tool walks the bundle and tries to sign each Mach-O file it
        # finds. An object file is MH_OBJECT, which is not one of the four
        # types ldid accepts, so it asserts and the install fails:
        #
        #   _assert(): filetype == MH_EXECUTE || MH_DYLIB || MH_DYLINKER || MH_BUNDLE
        #
        # Removing them makes the bundle signable (and much smaller).
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -name "*.app" | head -n 1)
          [ -n "$APP" ] || { echo "::error::No .app to strip."; exit 1; }

          echo "Before: $(du -sh "$APP" | cut -f1)"
          echo "Intermediate dirs found: $(find "$APP" -type d -name "*.p" | wc -l)"
          echo "Object files found:      $(find "$APP" -type f -name "*.o" | wc -l)"
          echo "Static archives found:   $(find "$APP" -type f -name "*.a" | wc -l)"

          find "$APP" -type d -name "*.p" -prune -exec rm -rf {} +
          find "$APP" -type f \( -name "*.o" -o -name "*.a" \) -delete

          echo "After:  $(du -sh "$APP" | cut -f1)"

          # Nothing unsignable may remain, or the install fails on device.
          LEFT=$(find "$APP" \( -type d -name "*.p" \) -o \( -type f \( -name "*.o" -o -name "*.a" \) \) | wc -l)
          if [ "$LEFT" -ne 0 ]; then
            echo "::error::$LEFT build intermediates survived the strip."
            find "$APP" \( -type d -name "*.p" \) -o \( -type f \( -name "*.o" -o -name "*.a" \) \)
            exit 1
          fi

          echo "--- Mach-O types remaining in the bundle ---"
          find "$APP" -type f | while read -r f; do
            desc=$(file -b "$f" 2>/dev/null || true)
            case "$desc" in
              *Mach-O*) echo "$desc" | sed 's/ (for architecture.*//' ;;
            esac
          done | sort | uniq -c | sort -rn

          # An object file anywhere is what breaks ldid; fail loudly if one is left.
          if find "$APP" -type f -exec sh -c 'file -b "$1" 2>/dev/null | grep -q "Mach-O.*object"' _ {} \; -print | grep -q .; then
            echo "::error::A Mach-O object file is still present; ldid will refuse to sign."
            exit 1
          fi
          echo "No object files remain - bundle is signable."

      - name: Make the bundle transferable (AFC)
        # SideStore copies the app to the device over AFC (Apple File
        # Conduit). "AFC was unable to manage files on the device" means the
        # transfer failed, not the signature. The usual culprits:
        #
        #   symlinks   macOS-style frameworks are full of them
        #              (Versions/Current -> A). iOS bundles must be flat, and
        #              AFC will not recreate links on the device.
        #   bulk       the embedded CPython ships its own test suite and
        #              tkinter/idlelib, which this app never imports - tens of
        #              MB and thousands of files, some with awkward names.
        #
        # Everything here is reported before it is changed, so the log shows
        # what was actually wrong.
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -name "*.app" | head -n 1)
          [ -n "$APP" ] || { echo "::error::No .app to process."; exit 1; }

          echo "=== before ==="
          echo "size:     $(du -sh "$APP" | cut -f1)"
          echo "files:    $(find "$APP" -type f | wc -l)"
          echo "symlinks: $(find "$APP" -type l | wc -l)"

          echo "--- symlinks found ---"
          find "$APP" -type l -exec sh -c 'echo "  $1 -> $(readlink "$1")"' _ {} \; | head -40

          # Replace each symlink with a real copy of what it points at.
          find "$APP" -type l > "$RUNNER_TEMP/links.txt"
          while IFS= read -r link; do
            [ -n "$link" ] || continue
            target=$(cd "$(dirname "$link")" && readlink -f "$(basename "$link")" 2>/dev/null || true)
            if [ -n "$target" ] && [ -e "$target" ]; then
              rm -f "$link"
              cp -R "$target" "$link"
              echo "  resolved: $link"
            else
              rm -f "$link"
              echo "  removed broken link: $link"
            fi
          done < "$RUNNER_TEMP/links.txt"

          # Drop stdlib the game never imports. Guarded by -maxdepth so this
          # can only match the embedded interpreter's own lib directory.
          for junk in test tests idlelib tkinter turtledemo lib2to3 ensurepip pydoc_data; do
            find "$APP" -type d -name "$junk" -path "*lib/python*" -prune -exec rm -rf {} + 2>/dev/null || true
          done
          # Deliberately NOT removing __pycache__ here. The bundle is
          # read-only on device, so without the precompiled stdlib Python
          # would reparse every module on every launch and never be able to
          # cache the result.
          find "$APP" -type d -name "*.dist-info" -prune -exec rm -rf {} + 2>/dev/null || true

          echo "=== after ==="
          echo "size:     $(du -sh "$APP" | cut -f1)"
          echo "files:    $(find "$APP" -type f | wc -l)"
          LEFT=$(find "$APP" -type l | wc -l)
          echo "symlinks: $LEFT"
          if [ "$LEFT" -ne 0 ]; then
            echo "::error::$LEFT symlinks remain; AFC will fail to copy the app."
            find "$APP" -type l
            exit 1
          fi

          # Names AFC tends to dislike. Reported, not fatal - so we learn
          # whether they are actually present before treating them as a cause.
          echo "--- longest paths ---"
          find "$APP" | awk '{ print length, $0 }' | sort -rn | head -5 | cut -d" " -f2-
          echo "--- non-ASCII filenames ---"
          find "$APP" | LC_ALL=C grep -n '[^ -~]' | head -20 || echo "  none"
          echo "--- app must still have its executable ---"
          test -f "$APP/$(basename "$APP" .app)" && echo "  ok" || echo "::warning::no executable at the expected path"

      - name: Package as .ipa
        id: package
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app was produced."
            ls -la "$PRODUCTS" || true
            exit 1
          fi
          echo "Built: $APP"

          # An .ipa is just a zip with the bundle under Payload/.
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"

          NAME=$(basename "$APP" .app)
          IPA="$RUNNER_TEMP/${NAME}-unsigned.ipa"
          # No -y: that would store symlinks *as* symlinks, reintroducing the
          # very thing AFC cannot copy. Without it zip follows them and
          # stores real file contents.
          (cd "$STAGE" && zip -qr "$IPA" Payload)

          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}-unsigned" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Verify the bundle
        run: |
          set -uo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n 1)
          echo "--- signature ---"
          codesign -dv "$APP" 2>&1 || echo "(unsigned, as intended)"
          echo "--- python sources inside the bundle ---"
          find "$APP" -name "main.py" -o -name "__main__.py" | head
          echo "--- architectures ---"
          BIN="$APP/$(basename "$APP" .app)"
          [ -f "$BIN" ] && lipo -info "$BIN" || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.ipa }}
          retention-days: 30
          if-no-files-found: error
